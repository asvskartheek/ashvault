<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashvault</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
	--bone:#ece4d4;--dim:rgba(236,228,212,.62);--faint:rgba(236,228,212,.16);--blood:#d8402e;--ember:#ff9a3c;--gold:#ffd27a;--soul:#7fe7d4;--plate:rgba(8,7,6,.55);
	--display:'Cinzel','Trajan Pro',Georgia,serif;--label:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
html,body{margin:0;height:100%;background:#050507;overflow:hidden;color:var(--bone);font-family:var(--label);user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.off{display:none!important}
#ui{position:fixed;inset:0;pointer-events:none}
/* HUD */
#hud{position:absolute;inset:0;transition:opacity .4s}
#vitals{position:absolute;left:28px;bottom:26px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;width:min(360px,40vw)}
#lvl{grid-row:1/4;width:46px;height:46px;display:grid;place-items:center;font:800 20px var(--display);color:var(--gold);border:1px solid rgba(255,210,122,.45);background:var(--plate);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.bar{height:10px;background:rgba(0,0,0,.55);position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(236,228,212,.12)}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .12s}
.bar b{position:absolute;inset:0;transform-origin:left;background:rgba(255,255,255,.35);transition:transform .6s .25s}
#hp i{background:linear-gradient(90deg,#7d140c,var(--blood))}
#mp{height:6px}#mp i{background:linear-gradient(90deg,#8a3a08,var(--ember))}
#xp{height:3px}#xp i{background:var(--gold)}
#hpTxt{position:absolute;left:28px;bottom:84px;font:700 13px var(--label);letter-spacing:.12em;color:var(--dim)}
#abil{position:absolute;right:28px;bottom:26px;display:flex;gap:10px}
.ab{width:54px;height:54px;position:relative;background:var(--plate);border:1px solid var(--faint);display:grid;place-items:center}
.ab svg{width:28px;height:28px;stroke:var(--bone);fill:none;stroke-width:1.6;opacity:.9}
.ab .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) var(--p,0%),transparent 0)}
.ab .k{position:absolute;left:4px;top:2px;font:700 11px var(--label);color:var(--dim)}
.ab .n{position:absolute;right:4px;bottom:1px;font:700 14px var(--label);color:var(--gold)}
.ab.low{opacity:.45}
#top{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
#floorName{font:600 13px var(--display);letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
#compass{width:min(420px,50vw);height:14px;position:relative;border-bottom:1px solid var(--faint)}
#compass i{position:absolute;bottom:-1px;width:1px;height:6px;background:var(--faint)}
#goal{position:absolute;top:-2px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid var(--gold);transform:translateX(-50%);transition:opacity .3s}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(236,228,212,.7);box-shadow:0 0 4px #000}
#hurt{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(140,0,0,.75));opacity:0}
#lowhp{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(90,0,0,.6));opacity:0}
#bossbar{position:absolute;top:68px;left:50%;transform:translateX(-50%);width:min(560px,60vw);text-align:center}
#bossbar .bar{height:8px;margin-top:6px}
#bossbar .bar i{background:linear-gradient(90deg,#5a0d06,#d8402e)}
#bossName{font:800 15px var(--display);letter-spacing:.25em;color:var(--bone)}
#banner{position:absolute;top:28%;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .5s}
#banner .t{font:900 clamp(30px,5vw,64px) var(--display);letter-spacing:.14em;text-shadow:0 0 30px rgba(0,0,0,.9)}
/* d20 */
#d20{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;display:grid;place-items:center}
#d20 svg{width:110px;height:110px}
#d20 span{position:absolute;font:900 38px var(--display);color:#1a1006}
#d20.show{animation:pop .9s cubic-bezier(.2,1.6,.4,1) forwards}
#d20.fum span{color:#ddd}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-120deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(0)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
/* numbers */
.num{position:absolute;left:0;top:0;font:800 22px var(--display);color:var(--bone);text-shadow:0 2px 6px #000,0 0 2px #000;opacity:0;white-space:nowrap;will-change:transform}
.num.fire{color:#ffb060}
.num.crit{color:var(--gold);font-size:38px}
.num.fum{color:#9a958c;font-size:16px}
.num.heal{color:#7fe78a}
.num.xp{color:var(--soul);font-size:16px}
/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;pointer-events:auto;background:radial-gradient(ellipse at center,rgba(5,5,7,.35),rgba(5,5,7,.92))}
.mark{font:900 clamp(48px,10vw,124px) var(--display);letter-spacing:.18em;margin-right:-.18em;line-height:1;background:linear-gradient(#f4e7cc,#9c7a48);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 30px rgba(0,0,0,.8))}
.go{font:700 18px var(--label);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.keys{display:grid;grid-template-columns:repeat(4,auto);gap:10px 26px;font:600 14px var(--label);letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.keys b{color:var(--bone);font-weight:700;margin-right:8px}
.stats{display:flex;gap:40px;font:600 15px var(--label);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.stats b{display:block;font:800 34px var(--display);color:var(--bone);letter-spacing:.05em}
#cover{position:fixed;inset:0;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:#050507;z-index:5;transition:opacity .6s}
#cover.done{opacity:0;pointer-events:none}
#cover .bar{width:min(320px,60vw);height:2px}
#cover .bar i{background:var(--gold);transform:scaleX(0)}
/* boons */
#boons{gap:30px}
#boons .h{font:800 28px var(--display);letter-spacing:.25em;color:var(--gold)}
#cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:94vw}
.card{width:min(210px,29vw);min-height:250px;padding:22px 18px;box-sizing:border-box;background:linear-gradient(rgba(30,24,18,.92),rgba(12,10,8,.95));border:1px solid rgba(255,210,122,.25);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover,.card.sel{transform:translateY(-8px);border-color:var(--gold)}
.card .ic{font:900 46px var(--display);color:var(--ember)}
.card .nm{font:800 18px var(--display);letter-spacing:.08em}
.card .ds{font:600 16px var(--label);color:var(--dim);letter-spacing:.03em}
.card .k{margin-top:auto;font:700 13px var(--label);color:var(--gold);letter-spacing:.2em}
</style>
</head>
<body>
<div id="cover"><div class="mark" style="font-size:44px">ASHVAULT</div><div class="bar"><i id="load"></i></div></div>
<div id="ui">
	<div id="hud" class="off">
		<div id="hurt"></div><div id="lowhp"></div>
		<div id="top"><div id="floorName"></div><div id="compass"><div id="goal"></div></div></div>
		<div id="bossbar" class="off"><div id="bossName"></div><div class="bar"><b></b><i></i></div></div>
		<div id="cross"></div>
		<div id="banner"><div class="t"></div></div>
		<div id="d20"><svg viewBox="0 0 100 100"><polygon points="50,3 93,27 93,73 50,97 7,73 7,27" fill="#ffd27a" stroke="#6b4a14" stroke-width="3"/><polygon points="50,20 80,68 20,68" fill="none" stroke="#6b4a14" stroke-width="2.5"/><path d="M50 3 50 20M93 27 80 68M7 27 20 68M50 97 20 68M50 97 80 68M7 73 20 68M93 73 80 68M7 27 50 20M93 27 50 20" stroke="#6b4a14" stroke-width="2"/></svg><span></span></div>
		<div id="hpTxt"></div>
		<div id="vitals">
			<div id="lvl">1</div>
			<div class="bar" id="hp"><b></b><i></i></div>
			<div class="bar" id="mp"><i></i></div>
			<div class="bar" id="xp"><i></i></div>
		</div>
		<div id="abil">
			<div class="ab" id="abFire"><svg viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5"/></svg><div class="cd"></div><span class="k">RMB</span></div>
			<div class="ab" id="abDash"><svg viewBox="0 0 24 24"><path d="M4 12h12M12 6l6 6-6 6M3 7h5M3 17h5"/></svg><div class="cd"></div><span class="k">SPACE</span></div>
			<div class="ab" id="abWave"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="10.5" stroke-dasharray="3 3"/></svg><div class="cd"></div><span class="k">Q</span></div>
			<div class="ab" id="abPot"><svg viewBox="0 0 24 24"><path d="M10 3h4M10 3v5L6 14a6 6 0 1 0 12 0l-4-6V3"/><path d="M7 15h10"/></svg><div class="cd"></div><span class="k">E</span><span class="n" id="potN">2</span></div>
		</div>
	</div>
	<div id="nums"></div>
	<div id="title" class="screen off">
		<div class="mark">ASHVAULT</div>
		<div class="keys">
			<span><b>WASD</b>Move</span><span><b>LMB</b>Sword</span><span><b>RMB</b>Fire bolt</span><span><b>Space</b>Dodge</span>
			<span><b>Shift</b>Sprint</span><span><b>Q</b>Shockwave</span><span><b>E</b>Potion</span><span><b>P</b>Pause</span>
		</div>
		<div class="go" id="goTxt">Click to descend</div>
	</div>
	<div id="pause" class="screen off"><div class="mark" style="font-size:56px">PAUSED</div><div class="go">Click to resume</div></div>
	<div id="dead" class="screen off">
		<div class="mark" style="font-size:72px;background:linear-gradient(#ffb0a0,#7a1a10);-webkit-background-clip:text;background-clip:text">FALLEN</div>
		<div class="stats"><span><b id="sFloor">1</b>Floor</span><span><b id="sKills">0</b>Slain</span><span><b id="sLvl">1</b>Level</span><span><b id="sTime">0:00</b>Time</span></div>
		<div class="go">Click to rise again</div>
	</div>
	<div id="boons" class="screen off"><div class="h">LEVEL UP</div><div id="cards"></div></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
